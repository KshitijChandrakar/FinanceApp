<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>transaction form - full portfolio view</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: "Courier New", monospace;
                background: #f5f5f0;
                color: #1a1a1a;
                min-height: 100vh;
            }

            .page-wrapper {
                display: flex;
                gap: 0;
                min-height: 100vh;
            }

            .left-panel {
                flex: 6;
                background: #fff;
                border-right: 2px solid #1a1a1a;
                padding: 24px 20px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                min-width: 0;
            }

            .right-panel {
                flex: 4;
                padding: 24px 20px;
                background: #f5f5f0;
                overflow-y: auto;
                min-width: 0;
            }

            h3 {
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                border-bottom: 2px solid #1a1a1a;
                padding-bottom: 6px;
                margin-bottom: 14px;
                color: #1a1a1a;
            }

            #mode-bar {
                display: flex;
                gap: 0;
                border: 1.5px solid #1a1a1a;
                width: fit-content;
                margin-bottom: 14px;
            }
            .mode-btn {
                cursor: pointer;
                padding: 5px 12px;
                font-family: inherit;
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                border: none;
                border-right: 1.5px solid #1a1a1a;
                background: #fff;
                color: #1a1a1a;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .mode-btn:last-child {
                border-right: none;
            }
            .mode-btn.active {
                background: #1a1a1a;
                color: #fff;
            }
            .mode-btn:hover:not(.active) {
                background: #f0f0e8;
            }

            .form-table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 12px;
            }
            .form-table th {
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                padding: 4px 8px;
                text-align: left;
                color: #666;
            }
            .form-table td {
                padding: 6px 8px;
                vertical-align: top;
            }
            .form-table .arrow-cell {
                vertical-align: middle;
                font-size: 1.2rem;
                padding: 0 8px;
                color: #999;
            }

            label {
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #666;
                display: block;
                margin-bottom: 3px;
            }
            select,
            input[type="number"] {
                font-family: inherit;
                font-size: 0.78rem;
                padding: 5px 7px;
                border: 1.5px solid #ccc;
                background: #fff;
                color: #1a1a1a;
                width: 100%;
                outline: none;
                transition: border-color 0.15s;
            }
            select:focus,
            input[type="number"]:focus {
                border-color: #1a1a1a;
            }
            select:disabled {
                background: #f0f0ee;
                color: #aaa;
            }

            .amount-row {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
            }
            .amount-row label {
                margin-bottom: 0;
                white-space: nowrap;
            }
            .amount-row input {
                max-width: 180px;
            }

            .action-btns {
                display: flex;
                gap: 8px;
                margin-bottom: 10px;
            }
            .action-btns button {
                font-family: inherit;
                font-size: 0.72rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                padding: 7px 20px;
                border: 1.5px solid #1a1a1a;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            #buy-btn {
                background: #1a1a1a;
                color: #fff;
            }
            #buy-btn:hover {
                background: #333;
            }
            #sell-btn {
                background: #fff;
                color: #1a1a1a;
            }
            #sell-btn:hover {
                background: #f0f0e8;
            }

            #message {
                font-size: 0.72rem;
                padding: 6px 8px;
                min-height: 24px;
                border-left: 3px solid transparent;
                background: transparent;
                transition: all 0.2s;
            }
            #message:not(:empty) {
                border-left-color: #1a6fbd;
                background: #e8f0fb;
            }

            #history-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.7rem;
            }
            #history-table th {
                background: #1a1a1a;
                color: #fff;
                padding: 5px 7px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                text-align: left;
                white-space: nowrap;
            }
            #history-table td {
                padding: 4px 7px;
                border-bottom: 1px solid #e5e5e0;
                color: #333;
            }
            #history-table tr:last-child td {
                border-bottom: none;
            }

            .portfolio-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 18px;
            }
            .portfolio-card:nth-child(5) {
                grid-column: 1 / -1;
                max-width: 50%;
                justify-self: center;
                width: 100%;
            }

            .portfolio-card {
                background: #fff;
                border: 1.5px solid #1a1a1a;
            }

            .portfolio-card h4 {
                font-size: 0.65rem;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                padding: 8px 10px;
                border-bottom: 1.5px solid #1a1a1a;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .portfolio-card h4 .cat-badge {
                display: inline-block;
                padding: 2px 7px;
                font-size: 0.6rem;
                border: 1px solid currentColor;
                border-radius: 2px;
                margin-left: auto;
                letter-spacing: 0.08em;
                font-variant-numeric: tabular-nums;
            }

            .cat-assets h4 {
                color: #1a6fbd;
            }
            .cat-bonds h4 {
                color: #7b4a00;
            }
            .cat-commodities h4 {
                color: #8b5a00;
            }
            .cat-crypto h4 {
                color: #5b2d8e;
            }
            .cat-equities h4 {
                color: #1a7a3a;
            }

            .cat-assets {
                border-color: #1a6fbd;
            }
            .cat-bonds {
                border-color: #c87530;
            }
            .cat-commodities {
                border-color: #d4a017;
            }
            .cat-crypto {
                border-color: #9b59d0;
            }
            .cat-equities {
                border-color: #2eaa55;
            }

            .cat-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.73rem;
            }
            .cat-table th {
                padding: 5px 10px;
                font-size: 0.62rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #888;
                text-align: left;
                background: #fafafa;
                border-bottom: 1px solid #e8e8e0;
            }
            .cat-table td {
                padding: 5px 10px;
                border-bottom: 1px solid #f0f0e8;
                color: #333;
            }
            .cat-table tr:last-child td {
                border-bottom: none;
            }
            .cat-table .amount-cell {
                text-align: right;
                font-variant-numeric: tabular-nums;
                font-weight: 600;
            }
            .zero-balance {
                color: #bbb !important;
            }

            tr.preview-src {
                outline: 2px dashed #dc2626;
            }
            tr.preview-dst {
                outline: 2px dashed #16a34a;
            }
            tr.commit-src {
                outline: 2px solid #dc2626;
            }
            tr.commit-dst {
                outline: 2px solid #16a34a;
            }
            tr.preview-hist {
                outline: 2px dashed orange;
                background: #fffde7;
            }
            tr.commit-hist {
                outline: 2px solid orange;
                background: #fffde7;
            }

            .locked-label {
                font-size: 0.78rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: #1a6fbd;
                padding: 5px 7px;
                border: 1.5px dashed #1a6fbd;
                display: inline-block;
                background: #e8f0fb;
            }

            hr {
                border: none;
                border-top: 1.5px solid #e8e8e0;
            }
        </style>
    </head>
    <body>
        <div class="page-wrapper">
            <!-- ── LEFT PANEL ── -->
            <div class="left-panel">
                <!-- transaction form -->
                <div>
                    <h3>add transaction</h3>
                    <div id="mode-bar">
                        <button class="mode-btn active" data-mode="double">double entry</button>
                        <button class="mode-btn" data-mode="single-buy">single buy</button>
                        <button class="mode-btn" data-mode="single-sell">single sell</button>
                    </div>
                    <table class="form-table">
                        <thead>
                            <tr>
                                <th>source</th>
                                <th></th>
                                <th>destination</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <label for="src-category">category</label>
                                    <select id="src-category">
                                        <option value="">select a category</option>
                                    </select>
                                    <span id="src-category-locked" class="locked-label" style="display: none"></span>
                                </td>
                                <td class="arrow-cell">→</td>
                                <td>
                                    <label for="dst-category">category</label>
                                    <select id="dst-category">
                                        <option value="">select a category</option>
                                    </select>
                                    <span id="dst-category-locked" class="locked-label" style="display: none"></span>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="src-subcategory">subcategory</label>
                                    <select id="src-subcategory" disabled>
                                        <option value="">select a category first</option>
                                    </select>
                                </td>
                                <td></td>
                                <td>
                                    <label for="dst-subcategory">subcategory</label>
                                    <select id="dst-subcategory" disabled>
                                        <option value="">select a category first</option>
                                    </select>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="amount-row">
                        <label for="amount">amount</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" />
                    </div>
                    <div class="action-btns">
                        <button id="buy-btn">buy</button>
                        <button id="sell-btn">sell</button>
                    </div>
                    <div id="message"></div>
                </div>
                <hr />
                <!-- transaction history -->
                <div>
                    <h3>transaction history</h3>
                    <table id="history-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>action</th>
                                <th>src cat</th>
                                <th>src sub</th>
                                <th>dst cat</th>
                                <th>dst sub</th>
                                <th>amount</th>
                                <th>timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="history-body">
                            <tr>
                                <td colspan="8">no transactions yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- ── RIGHT PANEL ── -->
            <div class="right-panel">
                <h3 style="margin-bottom: 18px">portfolio</h3>
                <div class="portfolio-grid" id="portfolio-grid">
                    <!-- injected by JS -->
                </div>
            </div>
        </div>
        <script>
            // ─── DATA ──────────────────────────────────────────────────────────
            const categories = {
                assets: ["cash", "bank balance"],
                equities: ["aapl", "tsla", "googl", "msft"],
                crypto: ["bitcoin", "ethereum", "solana"],
                bonds: ["us treasury", "corporate bond", "municipal bond"],
                commodities: ["gold", "silver", "crude oil"],
            };
            const categoryOrder = [
                "assets",
                "bonds",
                "commodities",
                "crypto",
                "equities",
            ];

            function buildFullPortfolioTemplate() {
                const fullList = [];
                for (const [cat, subList] of Object.entries(categories))
                    for (const sub of subList)
                        fullList.push({
                            category: cat,
                            subcategory: sub,
                            amount: 0,
                        });
                return fullList;
            }
            let portfolioMaster = buildFullPortfolioTemplate();

            function findPortfolioIndex(cat, sub) {
                return portfolioMaster.findIndex(
                    (e) => e.category === cat && e.subcategory === sub,
                );
            }
            function getBalance(cat, sub) {
                const idx = findPortfolioIndex(cat, sub);
                return idx === -1 ? -1 : portfolioMaster[idx].amount;
            }
            function debit(cat, sub, amount) {
                const idx = findPortfolioIndex(cat, sub);
                if (idx === -1) return false;
                portfolioMaster[idx].amount =
                    Math.round((portfolioMaster[idx].amount - amount) * 100) /
                    100;
                return true;
            }
            function credit(cat, sub, amount) {
                const idx = findPortfolioIndex(cat, sub);
                if (idx === -1) return false;
                portfolioMaster[idx].amount =
                    Math.round((portfolioMaster[idx].amount + amount) * 100) /
                    100;
                return true;
            }

            function getCategoryTotal(cat) {
                return portfolioMaster
                    .filter((e) => e.category === cat)
                    .reduce(
                        (sum, e) => Math.round((sum + e.amount) * 100) / 100,
                        0,
                    );
            }

            const history = [];

            // ─── DOM REFS ──────────────────────────────────────────────────────
            const srccategoryselect = document.getElementById("src-category");
            const srcsubcategoryselect =
                document.getElementById("src-subcategory");
            const srccategorylocked = document.getElementById(
                "src-category-locked",
            );
            const dstcategoryselect = document.getElementById("dst-category");
            const dstsubcategoryselect =
                document.getElementById("dst-subcategory");
            const dstcategorylocked = document.getElementById(
                "dst-category-locked",
            );
            const amountinput = document.getElementById("amount");
            const messagediv = document.getElementById("message");
            const buybtn = document.getElementById("buy-btn");
            const sellbtn = document.getElementById("sell-btn");
            const historybody = document.getElementById("history-body");
            const portfolioGrid = document.getElementById("portfolio-grid");

            // ─── MODE ──────────────────────────────────────────────────────────
            let currentmode = "double";

            function populateCategorySelect(sel) {
                sel.innerHTML = '<option value="">select a category</option>';
                Object.keys(categories).forEach((cat) => {
                    const o = document.createElement("option");
                    o.value = o.textContent = cat;
                    sel.appendChild(o);
                });
            }
            populateCategorySelect(srccategoryselect);
            populateCategorySelect(dstcategoryselect);

            function wireCategorySubcategory(catsel, subsel) {
                catsel.addEventListener("change", function () {
                    const c = this.value;
                    subsel.innerHTML =
                        '<option value="">select a subcategory</option>';
                    subsel.disabled = !c;
                    if (c && categories[c]) {
                        categories[c].forEach((sub) => {
                            const o = document.createElement("option");
                            o.value = o.textContent = sub;
                            subsel.appendChild(o);
                        });
                    }
                    triggerPreview();
                });
                subsel.addEventListener("change", triggerPreview);
            }
            wireCategorySubcategory(srccategoryselect, srcsubcategoryselect);
            wireCategorySubcategory(dstcategoryselect, dstsubcategoryselect);
            amountinput.addEventListener("input", triggerPreview);

            function applyMode(mode) {
                currentmode = mode;
                document.querySelectorAll(".mode-btn").forEach((btn) => {
                    btn.classList.toggle("active", btn.dataset.mode === mode);
                });
                resetFormFields();

                if (mode === "single-buy") {
                    buybtn.style.display = "";
                    sellbtn.style.display = "none";
                } else if (mode === "single-sell") {
                    buybtn.style.display = "none";
                    sellbtn.style.display = "";
                } else {
                    buybtn.style.display = "";
                    sellbtn.style.display = "";
                }

                if (mode === "single-buy") {
                    srccategoryselect.style.display = "none";
                    srccategorylocked.style.display = "";
                    srccategorylocked.textContent = "assets";
                    srcsubcategoryselect.innerHTML =
                        '<option value="">select a subcategory</option>';
                    categories["assets"].forEach((sub) => {
                        const o = document.createElement("option");
                        o.value = o.textContent = sub;
                        srcsubcategoryselect.appendChild(o);
                    });
                    srcsubcategoryselect.disabled = false;
                    dstcategoryselect.style.display = "";
                    dstcategorylocked.style.display = "none";
                    dstsubcategoryselect.disabled = true;
                    dstsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                } else if (mode === "single-sell") {
                    dstcategoryselect.style.display = "none";
                    dstcategorylocked.style.display = "";
                    dstcategorylocked.textContent = "assets";
                    dstsubcategoryselect.innerHTML =
                        '<option value="">select a subcategory</option>';
                    categories["assets"].forEach((sub) => {
                        const o = document.createElement("option");
                        o.value = o.textContent = sub;
                        dstsubcategoryselect.appendChild(o);
                    });
                    dstsubcategoryselect.disabled = false;
                    srccategoryselect.style.display = "";
                    srccategorylocked.style.display = "none";
                    srcsubcategoryselect.disabled = true;
                    srcsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                } else {
                    srccategoryselect.style.display = "";
                    srccategorylocked.style.display = "none";
                    dstcategoryselect.style.display = "";
                    dstcategorylocked.style.display = "none";
                    srcsubcategoryselect.disabled = true;
                    dstsubcategoryselect.disabled = true;
                    srcsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                    dstsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                }
                triggerPreview();
            }
            document.querySelectorAll(".mode-btn").forEach((btn) => {
                btn.addEventListener("click", () =>
                    applyMode(btn.dataset.mode),
                );
            });

            function resetFormFields() {
                if (currentmode !== "single-buy") {
                    srccategoryselect.value = "";
                    srcsubcategoryselect.value = "";
                }
                if (currentmode !== "single-sell") {
                    dstcategoryselect.value = "";
                    dstsubcategoryselect.value = "";
                }
                amountinput.value = "";
                if (currentmode === "double") {
                    srcsubcategoryselect.disabled = true;
                    dstsubcategoryselect.disabled = true;
                    srcsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                    dstsubcategoryselect.innerHTML =
                        '<option value="">select a category first</option>';
                }
                messagediv.textContent = "";
            }

            // ─── SANITIZE ──────────────────────────────────────────────────────
            function sanitizeInputs(mode = "full") {
                let srcCatRaw =
                    currentmode === "single-buy"
                        ? "assets"
                        : srccategoryselect.value;
                let dstCatRaw =
                    currentmode === "single-sell"
                        ? "assets"
                        : dstcategoryselect.value;
                const srcSubRaw = srcsubcategoryselect.value;
                const dstSubRaw = dstsubcategoryselect.value;
                const srcCat = (srcCatRaw || "").trim();
                const dstCat = (dstCatRaw || "").trim();
                if (mode === "full") {
                    if (!srcCat || !categories[srcCat])
                        return {
                            ok: false,
                            error: "Please select a valid source category.",
                        };
                    if (!srcSubRaw || !categories[srcCat]?.includes(srcSubRaw))
                        return {
                            ok: false,
                            error: "Please select a valid source subcategory.",
                        };
                    if (!dstCat || !categories[dstCat])
                        return {
                            ok: false,
                            error: "Please select a valid destination category.",
                        };
                    if (!dstSubRaw || !categories[dstCat]?.includes(dstSubRaw))
                        return {
                            ok: false,
                            error: "Please select a valid destination subcategory.",
                        };
                    if (srcCat === dstCat && srcSubRaw === dstSubRaw)
                        return {
                            ok: false,
                            error: "Source and destination cannot be the same.",
                        };
                    const amountNum = parseFloat(amountinput.value);
                    if (
                        isNaN(amountNum) ||
                        amountNum <= 0 ||
                        !isFinite(amountNum)
                    )
                        return {
                            ok: false,
                            error: "Amount must be a positive number.",
                        };
                    return {
                        ok: true,
                        srcCat,
                        srcSub: srcSubRaw,
                        dstCat,
                        dstSub: dstSubRaw,
                        amount: Math.round(amountNum * 100) / 100,
                    };
                }
                const amountNum = parseFloat(amountinput.value);
                return {
                    ok: true,
                    srcCat: srcCat && categories[srcCat] ? srcCat : null,
                    srcSub:
                        srcCat &&
                        srcSubRaw &&
                        categories[srcCat]?.includes(srcSubRaw)
                            ? srcSubRaw
                            : null,
                    dstCat: dstCat && categories[dstCat] ? dstCat : null,
                    dstSub:
                        dstCat &&
                        dstSubRaw &&
                        categories[dstCat]?.includes(dstSubRaw)
                            ? dstSubRaw
                            : null,
                    amount:
                        !isNaN(amountNum) &&
                        amountNum > 0 &&
                        isFinite(amountNum)
                            ? Math.round(amountNum * 100) / 100
                            : null,
                };
            }

            // ─── RENDER PORTFOLIO (5 separate tables) ──────────────────────────
            function buildPortfolioCards() {
                portfolioGrid.innerHTML = "";
                categoryOrder.forEach((cat) => {
                    const card = document.createElement("div");
                    card.className = `portfolio-card cat-${cat}`;
                    card.dataset.cat = cat;

                    const emoji =
                        {
                            assets: "🏦",
                            bonds: "📄",
                            commodities: "🪙",
                            crypto: "₿",
                            equities: "📈",
                        }[cat] || "";
                    card.innerHTML = `
            <h4>${emoji} ${cat}<span class="cat-badge" id="cat-total-${cat}">$0.00</span></h4>
            <table class="cat-table">
              <thead>
                <tr><th>subcategory</th><th style="text-align:right">amount ($)</th></tr>
              </thead>
              <tbody id="cat-body-${cat}"></tbody>
            </table>
          `;
                    portfolioGrid.appendChild(card);
                });
            }

            function escapeHtml(str) {
                return str.replace(/[&<>]/g, (m) =>
                    m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;",
                );
            }

            function renderPortfolio(highlights) {
                const h = highlights || {
                    srcKey: null,
                    dstKey: null,
                    style: "preview",
                    srcPreviewAmount: null,
                    dstPreviewAmount: null,
                };

                categoryOrder.forEach((cat) => {
                    const tbody = document.getElementById(`cat-body-${cat}`);
                    const totalBadge = document.getElementById(
                        `cat-total-${cat}`,
                    );
                    if (!tbody) return;

                    const entries = portfolioMaster
                        .filter((e) => e.category === cat)
                        .sort((a, b) =>
                            a.subcategory.localeCompare(b.subcategory),
                        );

                    tbody.innerHTML = entries
                        .map((entry) => {
                            const key = `${entry.category}||${entry.subcategory}`;
                            let rowClass = "";
                            let indicator = "";

                            if (h.style === "preview") {
                                if (h.srcKey === key) {
                                    rowClass = "preview-src";
                                    if (
                                        h.srcPreviewAmount !== null &&
                                        h.srcPreviewAmount > 0
                                    )
                                        indicator = `<span style="color:#dc2626;font-size:0.7rem;margin-left:6px">(-$${h.srcPreviewAmount.toFixed(2)})</span>`;
                                } else if (h.dstKey === key) {
                                    rowClass = "preview-dst";
                                    if (
                                        h.dstPreviewAmount !== null &&
                                        h.dstPreviewAmount > 0
                                    )
                                        indicator = `<span style="color:#16a34a;font-size:0.7rem;margin-left:6px">(+$${h.dstPreviewAmount.toFixed(2)})</span>`;
                                }
                            } else if (h.style === "commit") {
                                if (h.srcKey === key) rowClass = "commit-src";
                                else if (h.dstKey === key)
                                    rowClass = "commit-dst";
                            }

                            const amt = (entry.amount || 0).toFixed(2);
                            return `<tr class="${rowClass}">
              <td>${escapeHtml(entry.subcategory)}${indicator}</td>
              <td class="amount-cell ${entry.amount === 0 ? "zero-balance" : ""}">$${amt}</td>
            </tr>`;
                        })
                        .join("");

                    // ── Update grand total badge ──
                    if (totalBadge) {
                        const total = getCategoryTotal(cat);
                        totalBadge.textContent = `$${total.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                    }
                });
            }

            // ─── RENDER HISTORY ────────────────────────────────────────────────
            function renderHistory(opts) {
                opts = opts || {};
                const rev = [...history].reverse();
                const val = (v) => (v != null ? v : "—");
                const makeRow = (tx, cls) => `
          <tr class="${cls}">
            <td>${val(tx.id)}</td>
            <td>${val(tx.action)}</td>
            <td>${val(tx.srccat)}</td>
            <td>${val(tx.srcsub)}</td>
            <td>${val(tx.dstcat)}</td>
            <td>${val(tx.dstsub)}</td>
            <td>${tx.amount != null ? tx.amount.toFixed(2) : "—"}</td>
            <td>${val(tx.timestamp)}</td>
          </tr>`;

                let html = "";
                if (opts.ghostRow)
                    html += makeRow(opts.ghostRow, "preview-hist");
                if (rev.length === 0 && !opts.ghostRow) {
                    historybody.innerHTML =
                        '<tr><td colspan="8">no transactions yet</td></tr>';
                    return;
                }
                html += rev
                    .map((tx, i) =>
                        makeRow(
                            tx,
                            i === 0 && opts.commitTop ? "commit-hist" : "",
                        ),
                    )
                    .join("");
                historybody.innerHTML = html;
            }

            // ─── LIVE PREVIEW ──────────────────────────────────────────────────
            function triggerPreview() {
                messagediv.textContent = "";
                const p = sanitizeInputs("partial");
                let srcKey = null,
                    dstKey = null,
                    srcPreviewAmount = null,
                    dstPreviewAmount = null;
                let insufficientBalance = false;

                if (p.srcCat && p.srcSub) {
                    srcKey = `${p.srcCat}||${p.srcSub}`;
                    if (p.amount !== null && p.amount > 0) {
                        const balance = getBalance(p.srcCat, p.srcSub);
                        if (balance < p.amount) {
                            insufficientBalance = true;
                            messagediv.textContent = `Insufficient balance: ${p.srcSub} (${p.srcCat}) has $${balance.toFixed(2)}, need $${p.amount.toFixed(2)}.`;
                        } else {
                            srcPreviewAmount = p.amount;
                        }
                    }
                }
                if (p.dstCat && p.dstSub && !insufficientBalance) {
                    dstKey = `${p.dstCat}||${p.dstSub}`;
                    if (p.amount !== null && p.amount > 0)
                        dstPreviewAmount = p.amount;
                }

                renderPortfolio({
                    srcKey,
                    dstKey,
                    style: "preview",
                    srcPreviewAmount,
                    dstPreviewAmount,
                });

                const anyFilled =
                    p.srcCat || p.srcSub || p.dstCat || p.dstSub || p.amount;
                if (!anyFilled) {
                    renderHistory();
                    return;
                }
                const ghostTx = {
                    id: `${history.length + 1}*`,
                    action: "(preview)",
                    srccat: p.srcCat || "—",
                    srcsub: p.srcSub || "—",
                    dstcat: p.dstCat || "—",
                    dstsub: p.dstSub || "—",
                    amount: p.amount,
                    timestamp: "—",
                };
                renderHistory({ ghostRow: ghostTx });
            }

            // ─── COMMIT TRANSACTION ────────────────────────────────────────────
            function handleTransaction(action) {
                messagediv.textContent = "";
                const r = sanitizeInputs("full");
                if (!r.ok) {
                    messagediv.textContent = r.error;
                    return;
                }
                const { srcCat, srcSub, dstCat, dstSub, amount } = r;
                const srcBalance = getBalance(srcCat, srcSub);
                if (srcBalance < amount) {
                    messagediv.textContent = `Insufficient balance: ${srcSub} (${srcCat}) has $${srcBalance.toFixed(2)}, need $${amount.toFixed(2)}.`;
                    renderPortfolio();
                    renderHistory({});
                    return;
                }
                debit(srcCat, srcSub, amount);
                credit(dstCat, dstSub, amount);
                const label = action === "buy" ? "buy" : "sell";
                messagediv.textContent = `${label} successful: $${amount.toFixed(2)} moved from ${srcSub} (${srcCat}) → ${dstSub} (${dstCat}).`;
                history.push({
                    id: history.length + 1,
                    action: label,
                    srccat: srcCat,
                    srcsub: srcSub,
                    dstcat: dstCat,
                    dstsub: dstSub,
                    amount,
                    timestamp: new Date().toLocaleString(),
                });
                renderPortfolio({
                    srcKey: `${srcCat}||${srcSub}`,
                    dstKey: `${dstCat}||${dstSub}`,
                    style: "commit",
                    srcPreviewAmount: null,
                    dstPreviewAmount: null,
                });
                renderHistory({ commitTop: true });
                setTimeout(() => {
                    renderPortfolio();
                    renderHistory({});
                }, 10000);
                resetFormFields();
                if (currentmode === "double") {
                    srcsubcategoryselect.disabled = true;
                    dstsubcategoryselect.disabled = true;
                } else if (currentmode === "single-buy") {
                    dstsubcategoryselect.disabled = true;
                } else if (currentmode === "single-sell") {
                    srcsubcategoryselect.disabled = true;
                }
                triggerPreview();
            }

            buybtn.addEventListener("click", () => handleTransaction("buy"));
            sellbtn.addEventListener("click", () => handleTransaction("sell"));

            // ─── INIT ──────────────────────────────────────────────────────────
            function init() {
                const cashIdx = findPortfolioIndex("assets", "cash");
                if (cashIdx !== -1) portfolioMaster[cashIdx].amount = 100000;
                buildPortfolioCards();
                renderPortfolio();
                renderHistory({});
                applyMode("double");
            }
            init();
        </script>
    </body>
</html>
